{% extends "base.html" %}
{% block title %}{% if job %}Edit Job{% else %}Post a Job{% endif %} — JobPulse{% endblock %}
{% block content %}
<div class="container py-5">
  <div style="max-width:660px">
    <div class="section-label">{% if job %}Update Listing{% else %}New Listing{% endif %}</div>
    <div class="section-title">{% if job %}Edit "{{ job.title }}"{% else %}Post a Job{% endif %}</div>
    <div class="divider-tick"></div>

    <div style="background:#fff;border:1.5px solid var(--border);border-radius:8px;padding:2rem;box-shadow:6px 6px 0 var(--ink)">
      <form method="POST">
        <div class="row g-3">
          <div class="col-12">
            <label class="form-label-jp">Job Title *</label>
            <input class="form-control-jp" type="text" name="title" required
              value="{{ job.title if job else '' }}" placeholder="e.g. Senior Python Developer"/>
          </div>
          <div class="col-md-6">
            <label class="form-label-jp">Location *</label>
            <input class="form-control-jp" type="text" name="location" required
              value="{{ job.location if job else '' }}" placeholder="e.g. Mumbai, Remote"/>
          </div>
          <div class="col-md-6">
            <label class="form-label-jp">Salary (optional)</label>
            <input class="form-control-jp" type="text" name="salary"
              value="{{ job.salary if job else '' }}" placeholder="e.g. ₹8,00,000 – ₹14,00,000"/>
          </div>
          <div class="col-md-6">
            <label class="form-label-jp">Category *</label>
            <select class="form-control-jp" name="category" required>
              {% for cat in ['Technology','Design','Data Science','Management','Marketing','Finance','Operations','Other'] %}
                <option value="{{ cat }}" {% if job and job.category == cat %}selected{% endif %}>{{ cat }}</option>
              {% endfor %}
            </select>
          </div>
          <div class="col-md-6">
            <label class="form-label-jp">Job Type</label>
            <select class="form-control-jp" name="job_type">
              {% for jt in ['Full-time','Part-time','Remote','Contract','Internship'] %}
                <option value="{{ jt }}" {% if job and job.job_type == jt %}selected{% endif %}>{{ jt }}</option>
              {% endfor %}
            </select>
          </div>
          <div class="col-12">
            <label class="form-label-jp">Job Description *</label>
            <textarea class="form-control-jp" name="description" rows="10" required
              placeholder="Describe the role, responsibilities, requirements, and what you offer…" style="resize:vertical">{{ job.description if job else '' }}</textarea>
          </div>
        </div>
        <div class="d-flex gap-3 mt-4">
          <button type="submit" class="btn-accent-jp">{% if job %}Update Job{% else %}Post Job →{% endif %}</button>
          <a href="{{ url_for('employer_dashboard') }}" class="btn-outline-jp">Cancel</a>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
